<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vite-app</title>
    <script>
      (function () {
        var storageKey = "ui-theme";
        var root = document.documentElement;
        var storedTheme = window.localStorage.getItem(storageKey);
        var theme = storedTheme === "light" || storedTheme === "dark" || storedTheme === "dim" ? storedTheme : null;
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var resolvedTheme = theme || (prefersDark ? "dark" : "light");

        root.dataset.theme = resolvedTheme;
        root.classList.remove("dark", "dim");

        if (resolvedTheme === "dark") {
          root.classList.add("dark");
        }

        if (resolvedTheme === "dim") {
          root.classList.add("dark", "dim");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
