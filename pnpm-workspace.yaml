# ── Supply-chain security ─────────────────────────────────────────
# Block packages published less than 1 day ago (pnpm 11 default)
minimumReleaseAge: 1440

# Block git/tarball transitive deps — would have stopped the TanStack attack vector
blockExoticSubdeps: true

# Require explicit allowBuilds for any package with lifecycle scripts
strictDepBuilds: true

# Only allow build scripts for packages that genuinely need them
allowBuilds:
  esbuild: true
  msw: true
  sharp: true

# Detect trust-level downgrades (e.g. trusted publisher → unsigned)
trustPolicy: no-downgrade

# Exclude older packages that predate provenance attestation
trustPolicyExclude:
  - semver

# Ignore trust checks for packages published more than 1 year ago
trustPolicyIgnoreAfter: 525960

# Auto-download the exact pnpm version from packageManager field
pmOnFail: download

# Verify lockfile is current before running any script
verifyDepsBeforeRun: install
